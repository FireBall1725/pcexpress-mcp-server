[pytest]
# tools/ holds standalone scripts that talk to live PC Express; they are run by
# hand and must never be collected.
testpaths = tests

# The modules sit at the repo root, not in a package. Bare `pytest` does not put
# the working directory on sys.path (only `python -m pytest` does), so without
# this the tests import fine locally and fail in CI.
pythonpath = .
